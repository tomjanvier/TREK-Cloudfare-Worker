name: trek-cloudflare

on:
  push:
    paths:
      - "trek-cloudflare/**"
  pull_request:
    paths:
      - "trek-cloudflare/**"

defaults:
  run:
    working-directory: trek-cloudflare

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trek-cloudflare/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run
